name: Deploy Check

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/vue-app/**'
      - 'apps/nuxt-app/**'
      - 'services/auth-server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'packages/**'
      - 'eslint.config.mjs'
      - 'uno.config.ts'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  deploy-check-vue-app:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/adaptive-auth
      JWT_SECRET: ci-jwt-secret-string-at-least-thirty-two-bytes!!
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-at-least-thirty-two-bytes!!
      CRYPTR_KEY: '01234567890123456789012345678901'
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      NUXT_PUBLIC_APP_URL: http://localhost:3000
      PLAYWRIGHT_API_ROOT: http://localhost:4000

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Lint vue-app
        run: pnpm lint:vue-app

      - name: Type check vue-app
        run: pnpm type-check:vue-app

      - name: Build vue-app
        run: pnpm build:vue-app

      - name: Install Playwright (Chromium)
        run: pnpm --dir apps/vue-app exec playwright install chromium --with-deps

      - name: End-to-end tests (vue-app + auth-server)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-vue-app
          path: apps/vue-app/playwright-report/
          if-no-files-found: ignore

  deploy-check-nuxt-app:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/adaptive-auth
      JWT_SECRET: ci-jwt-secret-string-at-least-thirty-two-bytes!!
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-at-least-thirty-two-bytes!!
      CRYPTR_KEY: '01234567890123456789012345678901'
      NODE_ENV: development
      NUXT_PUBLIC_APP_URL: http://localhost:3000
      CLIENT_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      PLAYWRIGHT_API_ROOT: http://localhost:4000

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Lint nuxt-app
        run: pnpm lint:nuxt-app

      - name: Type check nuxt-app
        run: pnpm type-check:nuxt-app

      - name: Build nuxt-app
        run: pnpm build:nuxt-app

      - name: Install Playwright (Chromium)
        run: pnpm --dir apps/nuxt-app exec playwright install chromium --with-deps

      - name: End-to-end tests (nuxt-app + auth-server)
        run: pnpm test:e2e:nuxt-app

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nuxt-app
          path: apps/nuxt-app/playwright-report/
          if-no-files-found: ignore

  deploy-check-auth-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Lint auth-server
        run: pnpm lint:auth-server

      - name: Type check auth-server
        run: pnpm type-check:auth-server

      - name: Build auth-server
        run: pnpm build:auth-server
